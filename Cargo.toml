[package]
name = "fundguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Discord-first personal finance and payment awareness"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "migrate"] }
poise = { version = "0.7.1", default-features = false }
serenity = { version = "0.12.5", default-features = false, features = ["rustls_backend"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "signal", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
