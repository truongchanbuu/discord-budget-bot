name: Rust foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          fundguard_toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$fundguard_toolchain" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Compile check
        run: cargo check --locked

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fundguard_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: fundguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fundguard_test -d fundguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FUNDGUARD_TEST_PRIVATE_CLUSTER: "1"
      FUNDGUARD_TEST_DATABASE_URL: postgresql://fundguard_test:synthetic_test_only@localhost:5432/fundguard_test
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Test real PostgreSQL transactions
        run: bash scripts/verify-postgres-suites.sh
